<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent — Emperor Media House</title>
<meta name="description" content="Thank you for reaching out to Emperor Media House. We'll get back to you shortly.">
<link rel="icon" type="image/png" href="logoo.png">
<link rel="apple-touch-icon" href="logoo.png">
<style>
  :root{
    --bg:#0d0d10;
    --surface:#16161c;
    --surface-2:#1e1e27;
    --text:#f4f4f6;
    --muted:#a0a0b0;
    --accent:#e8b93c;
    --accent-soft:rgba(232,185,60,0.12);
    --border:rgba(255,255,255,0.08);
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;display:grid;place-items:center;
    padding:24px;position:relative;overflow:hidden;
  }
  body::before{
    content:"";position:absolute;top:-30%;left:50%;transform:translateX(-50%);
    width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle,var(--accent-soft),transparent 60%);
    pointer-events:none;
  }
  .card{
    position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:24px;padding:64px 48px;max-width:560px;width:100%;
    text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(30px)}
    to{opacity:1;transform:none}
  }
  .check{
    width:88px;height:88px;border-radius:50%;
    background:var(--accent-soft);border:2px solid var(--accent);
    display:grid;place-items:center;margin:0 auto 28px;
    animation:pop .5s .25s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop{
    from{transform:scale(0);opacity:0}
    to{transform:scale(1);opacity:1}
  }
  .check svg{
    width:44px;height:44px;stroke:var(--accent);stroke-width:3;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:60;stroke-dashoffset:60;
    animation:draw .6s .55s ease forwards;
  }
  @keyframes draw{ to{stroke-dashoffset:0} }
  .logo-row{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-bottom:24px;font-weight:800;font-size:1.1rem;letter-spacing:.5px;
  }
  .logo-row img{
    width:36px;height:36px;object-fit:contain;border-radius:9px;
    background:rgba(255,255,255,0.04);padding:3px;
  }
  .logo-row b{color:var(--accent)}
  h1{
    font-size:clamp(1.7rem,4vw,2.2rem);font-weight:800;
    letter-spacing:-.5px;line-height:1.2;margin-bottom:16px;
  }
  h1 em{font-style:normal;color:var(--accent)}
  p{
    color:var(--muted);font-size:1rem;margin-bottom:16px;
  }
  .note{
    background:var(--accent-soft);border:1px solid rgba(232,185,60,.25);
    border-radius:12px;padding:14px 18px;font-size:.88rem;
    color:var(--text);margin:24px 0 32px;
  }
  .note strong{color:var(--accent)}
  .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:13px 26px;
    border-radius:999px;font-weight:700;font-size:.92rem;
    transition:all .25s;border:1px solid transparent;
  }
  .btn-primary{background:var(--accent);color:#0d0d10}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(232,185,60,.3)}
  .btn-ghost{border-color:var(--border);color:var(--text);background:var(--surface-2)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .footer-note{
    margin-top:32px;padding-top:24px;border-top:1px solid var(--border);
    font-size:.78rem;color:var(--muted);
  }
  .footer-note a{color:var(--accent);font-weight:600}
  .footer-note a:hover{text-decoration:underline}
  @media(max-width:520px){
    .card{padding:48px 28px}
  }
</style>
</head>
<body>

<div class="card">
  <div class="check">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </div>

  <div class="logo-row">
    <img src="logoo.png" alt="Emperor Media House logo">
    <span>Emperor<b>Media</b></span>
  </div>

  <h1>Message sent — <em>thank you!</em></h1>
  <p>We've received your enquiry and our team will get back to you within <strong style="color:var(--accent)">24 hours</strong>.</p>

  <div class="note">
    <strong>Need a faster reply?</strong> Send us a quick message on WhatsApp — we're usually online.
  </div>

  <div class="btns">
    <a href="https://wa.me/2348169469137" target="_blank" rel="noopener" class="btn btn-primary">Chat on WhatsApp →</a>
    <a href="index.html" class="btn btn-ghost">← Back to Home</a>
  </div>

  <div class="footer-note">
    Questions? Email us at <a href="mailto:emperordigitalprints@gmail.com">emperordigitalprints@gmail.com</a>
  </div>
</div>

</body>
</html>
